name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[dev]"

      # Time-skipping Temporal test server, downloaded by tests/conftest.py.
      - uses: actions/cache@v6
        with:
          path: .temporal-test-server
          key: temporal-test-server-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - run: ruff check .

      - run: ruff format --check .

      - run: pytest
