# Local stack: Temporal dev server (+ web UI), the API and the worker, in fake LLM mode.
# Works without a .env file; copy .env.example to .env to override settings.
name: agentic-ticket-workflow

x-app: &app
  build:
    context: .
    target: app
  image: agentic-ticket-workflow:local
  env_file:
    - path: .env
      required: false
  environment:
    TEMPORAL_ADDRESS: temporal:7233
  depends_on:
    temporal:
      condition: service_healthy
  restart: unless-stopped

services:
  temporal:
    image: temporalio/temporal:1.9.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-ip", "0.0.0.0"]
    ports:
      - "7233:7233" # gRPC
      - "8233:8233" # web UI
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  api:
    <<: *app
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]

  # docker compose run --rm tests  — the whole suite, offline and keyless
  tests:
    build:
      context: .
      target: tests
    image: agentic-ticket-workflow:tests
    profiles: ["tests"]
    network_mode: none
    command: ["pytest", "-p", "no:cacheprovider"]
