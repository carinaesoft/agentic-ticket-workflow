# Local stack: Temporal dev server (+ web UI), the API and the worker, in fake LLM mode.
# Works without a .env file. Override settings in .env (copy .env.example) or in the shell,
# e.g. `HELPDESK_FAILURE_RATE=0.7 docker compose up`; the shell wins over .env. Empty values
# count as unset, so the app's own defaults apply.
name: agentic-ticket-workflow

x-app: &app
  build:
    context: .
    target: app
  image: agentic-ticket-workflow:local
  env_file:
    - path: .env
      required: false
  environment:
    TEMPORAL_ADDRESS: temporal:7233
    TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
    TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-tickets}
    LLM_PROVIDER: ${LLM_PROVIDER:-fake}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
    AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
    AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
    AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
    AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-}
    AGENT_MAX_TURNS: ${AGENT_MAX_TURNS:-6}
    AGENT_MAX_PARSE_RETRIES: ${AGENT_MAX_PARSE_RETRIES:-2}
    HELPDESK_FAILURE_RATE: ${HELPDESK_FAILURE_RATE:-0.2}
    HELPDESK_LOST_RESPONSE_RATE: ${HELPDESK_LOST_RESPONSE_RATE:-0.1}
    HELPDESK_SEED: ${HELPDESK_SEED:-}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
  depends_on:
    temporal:
      condition: service_healthy
  restart: unless-stopped

services:
  temporal:
    image: temporalio/temporal:1.9.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-ip", "0.0.0.0"]
    ports:
      - "7233:7233" # gRPC
      - "8233:8233" # web UI
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  api:
    <<: *app
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports:
      - "8000:8000"

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    # A bad setting exits with code 2 on every start: give up after 3 restarts instead of
    # looping forever.
    restart: on-failure:3

  # docker compose run --rm tests  — the whole suite, offline and keyless. pull_policy: build
  # rebuilds the image on every run (layer cache keeps it fast), so it tests the current code.
  tests:
    build:
      context: .
      target: tests
    image: agentic-ticket-workflow:tests
    pull_policy: build
    profiles: ["tests"]
    network_mode: none
    command: ["pytest", "-p", "no:cacheprovider"]
